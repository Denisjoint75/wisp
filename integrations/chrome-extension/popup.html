<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Wisp</title>
<style>
  body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; color: #1d1d1f; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; border-radius: 5px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c4392b; flex: none; }
  .dot.on { background: #2f9e44; }
  .dot.mid { background: #e8a317; }
  .muted { color: #6e6e73; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: #f2f2f5; padding: 2px 5px; border-radius: 4px; }
  pre { margin: 6px 0 0; padding: 8px 10px; background: #f2f2f5; border-radius: 6px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  button { margin-top: 10px; font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid #d2d2d7; background: #fafafa; cursor: pointer; }
  button:hover { background: #f0f0f3; }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; background: #1c1c1e; }
    .muted { color: #a1a1a6; }
    code, pre { background: #2c2c2e; }
    button { background: #2c2c2e; border-color: #3a3a3c; color: #f5f5f7; }
    button:hover { background: #3a3a3c; }
  }
</style>
</head>
<body>
  <h1><img src="icons/48.png" alt=""> Wisp</h1>
  <div class="row"><span id="dot" class="dot"></span><span id="state">Checking…</span></div>
  <div id="detail" class="muted"></div>
  <div id="help" hidden>
    <div class="muted">The native messaging host is not installed. In Terminal, run:</div>
    <pre>wisp chrome extension install</pre>
    <div class="muted" style="margin-top:6px">Wisp is installed with <code>brew install --cask owo-network/brew/wisp</code>.</div>
  </div>
  <button id="reconnect">Reconnect</button>
  <script src="popup.js"></script>
</body>
</html>
